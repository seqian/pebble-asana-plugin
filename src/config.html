<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asana for Pebble</title>
<style>
:root {color-scheme:light dark} body {font:16px system-ui,sans-serif; margin:0; padding:22px;max-width:580px}
h1{font-size:23px;margin:0 0 8px} p{line-height:1.45;color:inherit} label{display:block;margin:20px 0 8px;font-weight:600}
button,select{font:inherit;border-radius:9px;padding:12px;width:100%;box-sizing:border-box}
button{border:0;background:#f06a6a;color:#fff;margin-top:12px} button.alt{background:#777;color:white}
select{background:transparent;color:inherit;border:1px solid #888} [hidden]{display:none!important}
#status{padding:12px;border-radius:9px;background:rgba(128,128,128,.15);margin-top:16px}
.small{font-size:13px;opacity:.8}
</style></head><body>
<h1>Asana for Pebble</h1>
<p>Tasks are assigned to you in your chosen workspace.</p>
<button id="connect" hidden>Connect Asana</button>
<div id="choices" hidden><label for="workspace">Default workspace</label><select id="workspace"></select>
<div id="project-choice" hidden>
<label for="project">Default project</label><select id="project"></select>
<p class="small">Choose No project to send tasks to My Tasks. A specific destination from Index overrides this setting.</p>
</div>
<button id="disconnect" class="alt">Disconnect Asana</button></div>
<div id="status" role="status">Starting plugin…</div>
<script>
(function(){
 var connect=document.getElementById('connect'), choices=document.getElementById('choices');
 var select=document.getElementById('workspace'), disconnect=document.getElementById('disconnect'), status=document.getElementById('status');
 var projectChoice=document.getElementById('project-choice'), project=document.getElementById('project');
 var savedWorkspace='', savedProject='';
 async function send(message){return Pebble.sendMessage('plugin',message);}
 function message(text){status.textContent=text;}
 function addOption(control,value,label){
   var option=document.createElement('option');option.value=value;option.textContent=label;control.appendChild(option);
   return option;
 }
 function busy(value){select.disabled=value;project.disabled=value;disconnect.disabled=value;}
 async function loadProjects(){
   projectChoice.hidden=true;
   if(!savedWorkspace){message('Select a workspace to enable Asana for Index.');return;}
   message('Loading Asana projects…');
   var response=await send({type:'projects',workspace:savedWorkspace});
   if(response.error && typeof response.selected!=='string')throw Error(response.error);
   savedProject=response.selected||'';
   project.replaceChildren();
   addOption(project,'','No project');
   (response.projects||[]).forEach(function(p){addOption(project,p.gid,p.name);});
   var unavailable=savedProject && !(response.projects||[]).some(function(p){return String(p.gid)===savedProject;});
   if(unavailable)addOption(project,savedProject,'Saved project unavailable').disabled=true;
   project.value=savedProject;
   projectChoice.hidden=false;
   message(response.error || (unavailable?'Choose another default project or select No project.':'Ready to create Asana tasks.'));
 }
 async function load(){
   projectChoice.hidden=true;
   var state=await send({type:'status'}); if(state.error)throw Error(state.error);
   connect.hidden=state.connected;choices.hidden=!state.connected;
   if(!state.connected){message('Not connected. Sign in with Asana to continue.');return;}
   var response=await send({type:'workspaces'});if(response.error)throw Error(response.error);
   select.replaceChildren();
   addOption(select,'','Choose a workspace').disabled=true;
   (response.workspaces||[]).forEach(function(w){addOption(select,w.gid,w.name);});
   savedWorkspace=response.selected||'';
   select.value=savedWorkspace;
   await loadProjects();
 }
 connect.onclick=async function(){connect.disabled=true;busy(true);message('Opening Asana authorization…');
   try{var r=await send({type:'connect'});if(r.error)throw Error(r.error);await load();}
   catch(e){message(e.message||String(e));}finally{connect.disabled=false;busy(false);}
 };
 select.onchange=async function(){if(!select.value)return;busy(true);
   try{var r=await send({type:'select_workspace',gid:select.value});if(r.error)throw Error(r.error);
     savedWorkspace=r.workspace;await loadProjects();}
   catch(e){select.value=savedWorkspace;message(e.message||String(e));}finally{busy(false);}
 };
 project.onchange=async function(){busy(true);
   try{var r=await send({type:'select_project',workspace:savedWorkspace,gid:project.value});if(r.error)throw Error(r.error);
     savedProject=r.selected;
     var unavailable=Array.prototype.find.call(project.options,function(o){return o.disabled;});
     if(unavailable)unavailable.remove();
     message(savedProject?'Saved default project.':'Cleared default project.');
   }
   catch(e){project.value=savedProject;message(e.message||String(e));}finally{busy(false);}
 };
 disconnect.onclick=async function(){busy(true);
   try{var r=await send({type:'disconnect'});if(r.error)throw Error(r.error);await load();}
   catch(e){message(e.message||String(e));}finally{busy(false);}
 };
 Pebble.addEventListener('ready',async function(e){
   if(e.target!=='plugin')return;
   busy(true);
   try{await load();}catch(err){message(err.message||String(err));}finally{busy(false);}
 });
})();
</script></body></html>
